- name: Increase open files limit
  block:
    - pam_limits:
        domain: '*'
        limit_type: soft
        limit_item: nofile
        value: 1000000
    - pam_limits:
        domain: '*'
        limit_type: hard
        limit_item: nofile
        value: 1000000

- name: Tune kernel options
  block:
    - sysctl:
        name: net.ipv4.ip_local_port_range
        value: '1024   65000'
        state: present
        sysctl_set: yes
    - sysctl:
        name: net.ipv4.tcp_fin_timeout
        value: 10
        state: present
        sysctl_set: yes
    - sysctl:
        name: net.ipv4.tcp_tw_reuse
        value: 1
        state: present
        sysctl_set: yes
    - sysctl:
        name: vm.min_free_kbytes
        value: 1310720
        state: present
        sysctl_set: yes
    - sysctl:
        name: vm.swappiness
        value: 0
        state: present
        sysctl_set: yes

- name: Disable THP
  block:
    - copy:
        src: disable-transparent-hugepages
        dest: /etc/init.d/disable-transparent-hugepages
        owner: root
        group: root
        mode: 0755
    - copy:
        src: disable-transparent-hugepages.service
        dest: /etc/systemd/system/disable-transparent-huge-pages.service
        owner: root
        group: root
        mode: 0644
      register: result
    - systemd:
        daemon_reload: yes
      when: result.changed
    - service:
        name: disable-transparent-hugepages
        enabled: yes
        state: restarted
      ignore_errors: '{{ ansible_check_mode }}'