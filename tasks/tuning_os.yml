- name: Increase open files limit
  block:
    - name: "Increase open files limit: soft"
      pam_limits:
        domain: '*'
        limit_type: soft
        limit_item: nofile
        value: 1000000
    - name: "Increase open files limit: hard"
      pam_limits:
        domain: '*'
        limit_type: hard
        limit_item: nofile
        value: 1000000

- name: Tune kernel options
  block:
    - name: "Tune kernel options: net.ipv4.ip_local_port_range"
      sysctl:
        name: net.ipv4.ip_local_port_range
        value: '1024   65000'
        state: present
        sysctl_set: yes
    - name: "Tune kernel options: net.ipv4.tcp_fin_timeout"
      sysctl:
        name: net.ipv4.tcp_fin_timeout
        value: 10
        state: present
        sysctl_set: yes
    - name: "Tune kernel options: net.ipv4.tcp_tw_reuse"
      sysctl:
        name: net.ipv4.tcp_tw_reuse
        value: 1
        state: present
        sysctl_set: yes
    - name: "Tune kernel options: vm.min_free_kbytes"
      sysctl:
        name: vm.min_free_kbytes
        value: 1310720
        state: present
        sysctl_set: yes
    - name: "Tune kernel options: vm.swappiness"
      sysctl:
        name: vm.swappiness
        value: 0
        state: present
        sysctl_set: yes

- name: Disable THP
  block:
    - name: "Disable THP: copy init script"
      copy:
        src: disable-transparent-hugepages
        dest: /etc/init.d/disable-transparent-hugepages
        owner: root
        group: root
        mode: 0755
    - name: "Disable THP: copy systemd unit"
      copy:
        src: disable-transparent-hugepages.service
        dest: /etc/systemd/system/disable-transparent-huge-pages.service
        owner: root
        group: root
        mode: 0644
      register: result
    - name: "Disable THP: reload systemd"
      systemd:
        daemon_reload: yes
      when: result.changed
    - name: "Disable THP: start service"
      service:
        name: disable-transparent-hugepages
        enabled: yes
        state: restarted
      ignore_errors: '{{ ansible_check_mode }}'