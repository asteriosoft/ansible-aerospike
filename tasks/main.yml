---
- name: Set hostvars
  set_fact:
    aerospike_ip: "{{ aerospike_ip }}"
    aerospike_node_id: "{{ aerospike_node_id }}"

- name: "Include OS specific variables"
  include_vars: "{{ ansible_os_family }}.yml"
  tags: exporter

- name: Tuning OS
  import_tasks: tuning_os.yml
  when: aerospike_tune_os == true

- name: Create Aerospike log directory
  file:
    path: '{{ aerospike_log_directory }}'
    state: directory

- name: Copy logrotate.conf for aerospike logs
  copy:
    src: logrotate.conf
    dest: /etc/logrotate.d/aerospike
    owner: root
    group: root
    mode: '0644'

- name: Download Aerospike package
  unarchive:
    src: '{{ aerospike_download_url }}'
    dest: '/tmp'
    remote_src: True
    validate_certs: no

- name: Install Aerospike package and Tools
  become: true
  shell: 'cd /tmp/{{ aerospike_package_name }}; /tmp/{{ aerospike_package_name }}/asinstall; exit 0'

- name: Install python36
  yum:
    name: python36
    state: installed
  when: ansible_distribution == 'CentOS'

- name: Install python3
  yum:
    name: python3
    state: installed
  when: ansible_distribution == 'Amazon'

- name: Copy config files
  template:
    src: "{{ item }}.j2"
    dest: "/etc/aerospike/{{ item }}"
  with_items:
    - aerospike.conf
    - telemetry.conf
  notify:
    - restart aerospike

- name: Install aerospike prometheus exporter
  import_tasks:
    file: exporter.yml
  tags: exporter
  when: aerospike_exporter_install