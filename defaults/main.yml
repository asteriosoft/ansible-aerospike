---
aerospike_version: 6.4.0.6
aerospike_tools_version: 9.2.1
aerospike_edition: community
aerospike_log_directory: /var/log/aerospike

aerospike_download_url: https://download.aerospike.com/artifacts/aerospike-server-{{ aerospike_edition }}/{{ aerospike_version }}/aerospike-server-{{ aerospike_edition }}_{{ aerospike_version }}_tools-{{ aerospike_tools_version }}_{{ aerospike_distro }}_x86_64.tgz
aerospike_package_name: aerospike-server-{{ aerospike_edition }}_{{ aerospike_version }}_tools-{{ aerospike_tools_version }}_{{ aerospike_distro }}_x86_64

aerospike_cluster_name: default

# For AWS
#aerospike_ip: "{{ private_ip_address }}"
#aerospike_node_id: "{{ tags.Node_id }}"

# For GCP
#aerospike_ip: "{{ private_ip }}"
#aerospike_node_id: "{{ labels.node_id }}"

# Default
aerospike_ip: "127.0.0.1"
aerospike_node_id: "{{ play_hosts.index(inventory_hostname) }}"

